name: retention

on:
  push:
  pull_request:

jobs:
  storage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate storage contract with the pinned shared checker
        shell: bash
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/demand-storage-checker"
          git init "$checker"
          git -C "$checker" remote add origin https://github.com/DaizeDong/skill-smith.git
          git -C "$checker" fetch --depth 1 origin cd5bd393030fcfbb47b51ae21b80fb620767d9f9
          git -C "$checker" checkout --detach FETCH_HEAD
          git -C "$checker" submodule update --init --recursive
          python "$checker/skills/skill-smith/scripts/storage_contract.py" validate --repo "$GITHUB_WORKSPACE" --json
